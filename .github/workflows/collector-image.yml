name: Collector image

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mootrack-collector

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version-number.outputs.version }}
      is-prerelease: ${{ steps.set-version-number.outputs.is-prerelease }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Get version
        id: set-version-number
        uses: AndrewMcLachlan/Actions/get-dotnet-version@v4
        with:
          project: Directory.Build.props

      - name: Restore
        run: dotnet restore MooTrack.slnx

      # The image is a tax record's derivation engine. Shipping one whose maths is
      # broken would put wrong hours in that record, so the suite gates the push.
      - name: Test
        run: dotnet test MooTrack.slnx --no-restore --configuration Release

      - name: Publish
        run: >
          dotnet publish src/MooTrack.Collector/MooTrack.Collector.csproj
          --no-restore
          --configuration Release
          --output ${{ github.workspace }}/artifacts/collector
          --p:Version=${{ steps.set-version-number.outputs.version }}
          --p:AssemblyVersion=${{ steps.set-version-number.outputs.assembly-version }}
          --p:FileVersion=${{ steps.set-version-number.outputs.file-version }}
          --p:InformationalVersion=${{ steps.set-version-number.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.set-version-number.outputs.version }}
            type=raw,value=${{ steps.set-version-number.outputs.major }}.${{ steps.set-version-number.outputs.minor }},enable=${{ steps.set-version-number.outputs.is-prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.set-version-number.outputs.is-prerelease == 'false' }}
            type=sha,format=long

      # Context is the published output, so the image packages exactly what the tests
      # above ran against rather than recompiling from source inside the build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/artifacts/collector
          file: src/MooTrack.Collector/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "### Collector image"
            echo
            echo "Version \`${{ steps.set-version-number.outputs.version }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
