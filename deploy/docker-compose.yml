services:
  collector:
    image: ghcr.io/andrewmclachlan/mootrack-collector:latest
    hostname: mootrack
    restart: unless-stopped
    network_mode: bridge
    ports:
      - '8088:8080/tcp'
    environment:
      MOOTRACK_API_KEY: "${MOOTRACK_API_KEY:?set MOOTRACK_API_KEY}"
      MooTrack__RawRoot: /data/raw
      MooTrack__ReportRoot: /data/reports
      MooTrack__BridgeMinutes: "10"
      MooTrack__ConfirmationMinutes: "30"
      MooTrack__GapToleranceMinutes: "5"
      MooTrack__RegenerateDebounceSeconds: "60"
    volumes:
      - /volume1/docker/moo-track/data/raw:/data/raw
      - /volume1/docker/moo-track/data/reports:/data/reports
